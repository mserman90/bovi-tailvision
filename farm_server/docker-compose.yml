version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: bovi_mqtt_broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  farm-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bovi_farm_listener
    restart: always
    depends_on:
      - mqtt-broker
    environment:
      - BROKER_HOST=mqtt-broker
      - BROKER_PORT=1883

volumes:
  mosquitto_data:
  mosquitto_log:
